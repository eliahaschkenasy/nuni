</head>
<body>

        <svg viewBox="0 0 64 64" width="40" height="40">
          <path d="M 35.49 12.64 L 36.74 15.03 Q 40.23 21.67 47.62 22.94 L 50.29 23.39 Q 57.68 24.66 52.44 30.02 L 50.55 31.96 Q 45.31 37.33 46.4 44.75 L 46.79 47.42 Q 47.87 54.84 41.15 51.52 L 38.72 50.32 Q 32 47 25.28 50.32 L 22.85 51.52 Q 16.13 54.84 17.21 47.42 L 17.6 44.75 Q 18.69 37.33 13.45 31.96 L 11.56 30.02 Q 6.32 24.66 13.71 23.39 L 16.38 22.94 Q 23.77 21.67 27.26 15.03 L 28.51 12.64 Q 32 6 35.49 12.64 Z" fill="#ffd15c" stroke="#f5a623" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="25" cy="30" r="2.4" fill="#4a3b2a"/><circle cx="39" cy="30" r="2.4" fill="#4a3b2a"/>
          <path d="M27 37c2 2 8 2 10 0" fill="none" stroke="#4a3b2a" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name" data-i18n="brand_name">נוני</span>

    <nav class="main-nav" aria-label="Main">
      <a href="index.html" data-i18n="nav_home">דף הבית</a>

    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="he" class="is-active">עברית</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="ru">Русский</button>
      <button type="button" data-lang="fr">Français</button>
    </div>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </header>

  <main class="wrap coloring-main">
    <h1 data-i18n="coloring_title">דפי צביעה של נוני</h1>
    <p class="coloring-lead" data-i18n="coloring_intro">בחרו דף, הדפיסו וצבעו!</p>
    <p class="coloring-hint" data-i18n="coloring_hint">לחצו על תמונה כדי להדפיס אותה לבד.</p>
    <button class="btn btn-primary print-btn" id="printAll" type="button" data-i18n="coloring_print">הדפיסו את כל הדפים</button>

    <div class="coloring-grid">

      <!-- Nuni the star -->
      <figure class="sheet">
        <svg viewBox="0 0 240 240" role="img">
          <path d="M 131.82 43.16 L 137.56 54.39 Q 149.39 77.55 175.07 81.64 L 187.53 83.63 Q 213.2 87.72 194.84 106.12 L 185.92 115.05 Q 167.55 133.45 171.6 159.13 L 173.56 171.6 Q 177.6 197.28 154.43 185.5 L 143.18 179.78 Q 120 168 96.82 179.78 L 85.57 185.5 Q 62.4 197.28 66.44 171.6 L 68.4 159.13 Q 72.45 133.45 54.08 115.05 L 45.16 106.12 Q 26.8 87.72 52.47 83.63 L 64.93 81.64 Q 90.61 77.55 102.44 54.39 L 108.18 43.16 Q 120 20 131.82 43.16 Z"/>
          <circle cx="103" cy="105" r="7"/><circle cx="137" cy="105" r="7"/>
          <circle cx="88" cy="120" r="9"/><circle cx="152" cy="120" r="9"/>
          <path d="M104 128c8 8 24 8 32 0"/>
        </svg>
        <figcaption data-i18n="color_nuni">נוני הכוכב</figcaption>
      </figure>

      <!-- Breathing balloon -->
      <figure class="sheet">
        <svg viewBox="0 0 240 240" role="img">
          <path d="M120 40c34 0 58 26 58 60 0 40-34 66-58 66s-58-26-58-66c0-34 24-60 58-60z"/>
          <path d="M112 166l8 14 8-14"/>
          <path d="M120 180c0 18 14 22 14 40"/>
          <path d="M92 78c6-10 20-16 30-15"/>
        </svg>
        <figcaption data-i18n="color_balloon">בלון הנשימה</figcaption>
      </figure>

      <!-- Hospital bed -->
      <figure class="sheet">
        <svg viewBox="0 0 240 240" role="img">
          <path d="M30 120h150c18 0 30 12 30 30v20H30z"/>
          <path d="M30 90v90"/>
          <path d="M30 140h180"/>
          <rect x="44" y="104" width="46" height="26" rx="8"/>
          <circle cx="60" cy="184" r="12"/><circle cx="190" cy="184" r="12"/>
          <path d="M210 120V96"/>
        </svg>
        <figcaption data-i18n="color_bed">מיטת בית החולים</figcaption>
      </figure>

      <!-- Glass of water -->
      <figure class="sheet">
        <svg viewBox="0 0 240 240" role="img">
          <ellipse cx="120" cy="56" rx="42" ry="8"/>
          <path d="M78 56L88 198c0 6 6 10 12 10h40c6 0 12-4 12-10L162 56"/>
          <path d="M84 116q18 7 36 0t36 0"/>
          <circle cx="102" cy="150" r="3"/>
          <circle cx="132" cy="166" r="3"/>
          <circle cx="118" cy="138" r="2.4"/>
        </svg>
        <figcaption data-i18n="color_juice">כוס מים</figcaption>
      </figure>

      <!-- Magic mask -->
      <figure class="sheet">
        <svg viewBox="0 0 240 240" role="img">
          <path d="M120 70c30 0 46 22 46 54 0 24-20 46-46 46s-46-22-46-46c0-32 16-54 46-54z"/>
          <path d="M92 150c10 12 46 12 56 0"/>
          <path d="M120 170v22"/>
          <path d="M108 192h24"/>
          <path d="M96 96c8-8 40-8 48 0"/>
        </svg>
        <figcaption data-i18n="color_mask">מסכת הקסם</figcaption>
      </figure>

      <!-- Kind nurse, with a stethoscope round the neck -->
      <figure class="sheet">
        <svg viewBox="0 0 240 240" role="img">
          <circle cx="120" cy="66" r="32"/>
          <path d="M92 58c6-20 50-20 56 0"/>
          <circle cx="110" cy="66" r="3"/><circle cx="130" cy="66" r="3"/>
          <path d="M111 78c5 5 13 5 18 0"/>
          <path d="M108 94v14"/><path d="M132 94v14"/>
          <path d="M108 108C86 113 72 124 68 142L62 216h116l-6-74c-4-18-18-29-40-34"/>
          <path d="M108 108l12 22 12-22"/>
          <path d="M66 152h26"/><path d="M174 152h-26"/>
          <rect x="74" y="168" width="26" height="22" rx="3"/>
          <path d="M106 112C96 140 104 162 120 168"/>
          <path d="M134 112C144 138 138 160 122 168"/>
          <path d="M121 168l9 14"/>
          <circle cx="134" cy="194" r="13"/>
          <circle cx="134" cy="194" r="6"/>
        </svg>
        <figcaption data-i18n="color_nurse">האח הנחמד</figcaption>
      </figure>

      <!-- Anesthesia machine, connected to the mask -->
      <figure class="sheet sheet-wide">
        <svg viewBox="0 0 320 240" role="img">
          <!-- monitor -->
          <rect x="34" y="18" width="104" height="52" rx="6"/>
          <rect x="44" y="28" width="84" height="32" rx="3"/>
          <path d="M50 46h11l6-12 8 22 7-14 5 4h25"/>
          <!-- main body -->
          <rect x="28" y="70" width="116" height="132" rx="8"/>
          <!-- flowmeter tubes with floats -->
          <rect x="40" y="82" width="10" height="46" rx="5"/>
          <rect x="56" y="82" width="10" height="46" rx="5"/>
          <rect x="72" y="82" width="10" height="46" rx="5"/>
          <circle cx="45" cy="104" r="3"/><circle cx="61" cy="112" r="3"/><circle cx="77" cy="98" r="3"/>
          <!-- vaporizer with dial -->
          <rect x="94" y="82" width="38" height="46" rx="4"/>
          <circle cx="113" cy="105" r="12"/>
          <path d="M113 105l7-7"/>
          <!-- control knobs -->
          <circle cx="46" cy="146" r="7"/><circle cx="68" cy="146" r="7"/><circle cx="90" cy="146" r="7"/>
          <!-- drawer -->
          <rect x="38" y="164" width="96" height="30" rx="4"/>
          <path d="M78 179h16"/>
          <!-- castors -->
          <path d="M50 202v8"/><path d="M122 202v8"/>
          <circle cx="50" cy="218" r="10"/><circle cx="122" cy="218" r="10"/>
          <!-- breathing bag -->
          <path d="M144 122l12 8"/>
          <ellipse cx="168" cy="156" rx="18" ry="26"/>
          <!-- corrugated hose out to the mask -->
          <path d="M144 96C186 74 240 86 266 118"/>
          <path d="M144 118C182 100 232 110 254 136"/>
          <path d="M144 96v22"/>
          <path d="M176 82l-6 23"/><path d="M206 82l-7 23"/>
          <path d="M232 92l-9 22"/><path d="M252 106l-10 20"/>
          <!-- face mask -->
          <rect x="264" y="114" width="16" height="14" rx="4"/>
          <path d="M272 128c-16 0-24 12-24 22l3 12h42l3-12c0-10-8-22-24-22z"/>
          <ellipse cx="272" cy="176" rx="28" ry="16"/>
          <ellipse cx="272" cy="176" rx="15" ry="7"/>
        </svg>
        <figcaption data-i18n="color_machine">מכונת ההרדמה</figcaption>
      </figure>

    </div>
  </main>
