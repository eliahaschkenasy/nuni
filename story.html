          <path d="M760 264c8 7 22 7 30 0" fill="none" stroke="#4a3b2a" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- soft breathing mask lowering onto Nuni's face -->
        <g class="maskDown">
          <path d="M320 312c-15 0-22 11-22 20l3 10h38l3-10c0-9-7-20-22-20z" fill="#e3f2ff" stroke="#8fbfe0" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="320" cy="342" rx="26" ry="13" fill="#cfe8ff" stroke="#8fbfe0" stroke-width="4"/>
          <ellipse cx="320" cy="342" rx="14" ry="6" fill="#b9dcf5" opacity=".7"/>
          <rect x="312" y="302" width="16" height="14" rx="5" fill="#9ccbe6"/>
          <path d="M320 302C330 258 420 232 516 244" fill="none" stroke="#a9d4ec" stroke-width="9" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Scene 7 — while Nuni sleeps, the doctor watches -->
      <svg class="scene" viewBox="0 0 960 560" style="--dur:12s">
        <rect width="960" height="560" fill="#e9eefc"/>
        <rect y="440" width="960" height="120" fill="#d7defa"/>
        <rect x="220" y="360" width="420" height="80" rx="18" fill="#fff" stroke="#c9d0ec" stroke-width="6"/>
        <rect x="220" y="332" width="120" height="60" rx="14" fill="#ffe4ea" stroke="#c9d0ec" stroke-width="6"/>
        <use href="#nuniSleepPj" x="240" y="256" width="140" height="140"/>
        <g class="zzz float" fill="#8aa0c4" font-family="Rubik" font-weight="700">
          <text x="370" y="270" font-size="24">z</text><text x="392" y="250" font-size="32">Z</text>
        </g>
        <!-- monitor -->
        <rect x="700" y="150" width="180" height="130" rx="12" fill="#1f2740"/>
        <rect x="716" y="166" width="148" height="98" rx="6" fill="#0c1330"/>
        <polyline class="heartbeat" points="716,220 760,220 774,190 792,250 812,210 840,220 864,220" fill="none" stroke="#5ff2a8" stroke-width="4" stroke-linecap="round"/>
        <rect x="782" y="280" width="16" height="80" fill="#3a4569"/>
        <!-- doctor watching -->
        <g class="float2">
          <rect x="590" y="330" width="120" height="120" rx="34" fill="#9ad3b8"/>
          <circle cx="650" cy="292" r="40" fill="#ffd9b3"/>
          <path d="M612 278a38 22 0 0 1 76 0z" fill="#eaf4ef" stroke="#cfe4d8" stroke-width="3"/>
          <path d="M650 258 L657.79 271.5 L642.21 271.5 Z" fill="none" stroke="#e5484d" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M650 276 L642.21 262.5 L657.79 262.5 Z" fill="none" stroke="#e5484d" stroke-width="2.6" stroke-linejoin="round"/>
          <circle cx="638" cy="292" r="3.5" fill="#4a3b2a"/><circle cx="662" cy="292" r="3.5" fill="#4a3b2a"/>
          <path d="M638 304c7 5 17 5 24 0" fill="none" stroke="#4a3b2a" stroke-width="3.5" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Scene 8 — waking up happy -->
      <svg class="scene" viewBox="0 0 960 560" style="--dur:18s">
        <rect width="960" height="560" fill="#fff2d6"/>
        <g opacity=".5"><circle cx="480" cy="280" r="380" fill="#fff7e6"/></g>
        <rect y="440" width="960" height="120" fill="#ffe6b0"/>
        <!-- balloons -->
        <g class="balloonUp"><ellipse cx="180" cy="440" rx="30" ry="36" fill="#ff8aa0"/><line x1="180" y1="476" x2="180" y2="540" stroke="#d76"/></g>
        <g class="balloonUp2"><ellipse cx="800" cy="440" rx="28" ry="34" fill="#7ec8e3"/><line x1="800" y1="474" x2="800" y2="540" stroke="#69a"/></g>
        <g class="balloonUp3"><ellipse cx="620" cy="440" rx="26" ry="32" fill="#b7a8f2"/><line x1="620" y1="472" x2="620" y2="540" stroke="#87d"/></g>
        <!-- confetti -->
        <g fill="#ffce4a"><rect class="confetti" x="300" y="60" width="12" height="12" rx="2"/></g>
        <g fill="#8bd3b0"><rect class="confetti" x="540" y="40" width="12" height="12" rx="2" style="animation-delay:.6s"/></g>
        <g fill="#ff9db0"><rect class="confetti" x="700" y="70" width="12" height="12" rx="2" style="animation-delay:1.1s"/></g>
        <!-- bed -->
        <rect x="330" y="360" width="360" height="80" rx="18" fill="#fff" stroke="#e6cf9a" stroke-width="6"/>
        <rect x="330" y="332" width="110" height="60" rx="14" fill="#ffe0e6" stroke="#e6cf9a" stroke-width="6"/>
        <!-- parent beside -->
        <g class="float2">
          <rect x="640" y="300" width="130" height="150" rx="36" fill="#f2a35e"/>
          <circle cx="705" cy="256" r="46" fill="#ffd9b3"/>
          <path d="M662 240a46 30 0 0 1 92 0z" fill="#6d4c33"/>
          <circle cx="692" cy="258" r="4" fill="#4a3b2a"/><circle cx="720" cy="258" r="4" fill="#4a3b2a"/>
          <path d="M690 270c9 7 23 7 32 0" fill="none" stroke="#4a3b2a" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- Nuni asleep -> awake & happy -->
        <use class="fadeOutMid" href="#nuniSleepPj" x="380" y="250" width="150" height="150"/>
        <g class="fadeInMid"><g class="happyBounce"><use href="#nuniPj" x="380" y="238" width="150" height="150"/></g></g>
        <!-- popsicle -->
        <g class="pulse" style="transform-origin:560px 330px">
          <rect x="544" y="300" width="32" height="46" rx="14" fill="#ff6f91"/>
          <rect x="556" y="344" width="8" height="30" rx="3" fill="#d8a26a"/>
        </g>
        <!-- well-done medal -->
        <g class="popInLate">
          <circle cx="150" cy="180" r="46" fill="#ffd15c" stroke="#f5a623" stroke-width="6"/>
          <path d="M150 156l6 13 14 1-11 9 4 14-13-8-13 8 4-14-11-9 14-1z" fill="#fff"/>
        </g>
      </svg>

    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="play-btn" id="playBtn" aria-label="Play/Pause">⏸</button>
      <div class="progress"><div class="progress-fill" id="progress"></div></div>
      <button class="music-btn" id="musicBtn" aria-label="Music" title="Music">🔊</button>
      <button class="replay-btn" id="replayBtn" data-i18n="story_replay">מהתחלה</button>
    </div>

    <p class="caption" id="caption"></p>
  </main>

  <script src="i18n.js"></script>
  <script src="story.js"></script>
</body>
